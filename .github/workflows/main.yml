
name: Build Smart Calculator APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix and Check Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("app/src/main/AndroidManifest.xml")

          if not path.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found")

          content = path.read_text(encoding="utf-8-sig")
          content = content.lstrip(" \t\r\n")

          path.write_text(content, encoding="utf-8")

          ET.parse(path)

          print("SUCCESS: AndroidManifest.xml is valid")
          print("Manifest XML check passed")
          PY

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
