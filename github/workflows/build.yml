
      - name: Diagnose Manifest
        run: |
          echo "=== Manifest files ==="
          find . -name AndroidManifest.xml -type f
          echo "=== Main manifest bytes ==="
          xxd app/src/main/AndroidManifest.xml
          echo "=== XML validation ==="
          python3 -c "import xml.etree.ElementTree as E; E.parse('app/src/main/AndroidManifest.xml'); print('XML IS VALID')"

      - name: Build APK
        run: gradle assembleDebug --stacktrace
